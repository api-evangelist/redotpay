aid: redotpay
name: Redotpay
description: >-
  RedotPay is a global stablecoin-based payment fintech that integrates blockchain solutions with
  traditional banking and finance infrastructures. The platform lets millions of people spend and send
  digital assets through a crypto-backed Visa card, a multi-currency wallet, P2P trading, international
  transfers, and stablecoin earning. Its developer-facing surface is agentic: a first-party Rust CLI
  (redotpay) and a local MCP server / Agent Skill (redotpay-payment) that let AI agents settle HTTP 402
  "Payment Required" challenges over the Machine Payments Protocol (MPP), using OAuth2 device-flow login
  and per-payment idempotency against the production RedotPay API.
